
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: nerv_compliance
      POSTGRES_PASSWORD: localdevpassword
      POSTGRES_DB: postgres
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nerv_compliance -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

